name: Android Build

# Builds the debug APK on GitHub's hosted runners (which have the Android SDK and
# network access to the Gradle/Maven repositories that the dev container lacks),
# and uploads it as a downloadable artifact.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a build on demand from the Actions tab

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node — to build the web app that Capacitor wraps.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # JDK 17 is required by Android Gradle Plugin 8.2.x and Capacitor 6.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK (command-line tools). The runner's SDK + Gradle download the
      # rest (platform-34, build-tools 34.0.0) during the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Gradle caching for faster subsequent runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Copy the freshly built web assets into the native Android project.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-phone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
