<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Phone</title>
    <style>
      html {
        height: 100%;
      }
      /* Lock the page: the body is pinned to the viewport and never scrolls, so
         the phone shell can't be dragged around like a webpage. Internal app
         scrolling happens inside the shell, not at the page level. */
      body {
        margin: 0;
        padding: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      /* Allow text selection only where the game explicitly opts in. */
      .selectable {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
